name: Release

# Pushing a tag like v0.2.0 builds a jar for each Minecraft version as 0.2.0 and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          for mc in 26.1 1.21.1; do
            ./gradlew build --no-daemon -Pmc="$mc" -Pmod_version=${{ steps.version.outputs.version }}
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for mc in 26.1 1.21.1; do
            jar="build/$mc/libs/goldar-${{ steps.version.outputs.version }}+mc$mc.jar"
            test -f "$jar"
            cp "$jar" dist/
          done
          (cd dist && for jar in *.jar; do sha256sum "$jar" > "$jar.sha256"; done)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Goldar ${{ steps.version.outputs.version }}" \
            --generate-notes
