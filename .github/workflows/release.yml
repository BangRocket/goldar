name: Release

# Pushing a tag like v0.2.0 builds the jar as version 0.2.0 and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/goldar-${{ steps.version.outputs.version }}.jar"
          test -f "$jar"
          sha256sum "$jar" > "$jar.sha256"
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" \
            --title "Goldar ${{ steps.version.outputs.version }}" \
            --generate-notes
